name: World Daily Report
on:
  schedule:
    # Run at 12:00 PM UTC daily (noon)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allow manual trigger
jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run world report script
        env:
          DUNE_API_KEY_FRONTEND: ${{ secrets.DUNE_API_KEY_FRONTEND }}
          SLACK_WEBHOOK_JANUS: ${{ secrets.SLACK_WEBHOOK_JANUS }}
        run: |
          python world.py
