name: World Daily Report
on:
  schedule:
    # Run at 12:17 UTC daily (kept near noon, but off the top of the hour).
    # :00 is GitHub's most congested cron slot — scheduled runs get delayed
    # or dropped there under load. An off-peak, non-multiple-of-5 minute is
    # far more reliable.
    - cron: '17 12 * * *'
  workflow_dispatch:  # Allow manual trigger
permissions:
  contents: write  # NEW: lets the job push the report image to the world-report-charts branch
jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install matplotlib numpy  # NEW: needed to draw the image
      - name: Run world report script
        env:
          DUNE_API_KEY_FRONTEND: ${{ secrets.DUNE_API_KEY_FRONTEND }}
          SLACK_WEBHOOK_JANUS: ${{ secrets.SLACK_WEBHOOK_JANUS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # NEW: used to push the image (GitHub gives this automatically)
        run: |
          python world.py
